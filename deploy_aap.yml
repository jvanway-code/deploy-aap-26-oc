---
- name: Deploy Ansible Automation Platform
  hosts: localhost
  connection: local
  vars:
    # OpenShift Connection
    openshift_host: "{{ lookup('env', 'K8S_AUTH_HOST') }}"
    openshift_api_key: "{{ lookup('env', 'OCP_TOKEN') }}"
    openshift_verify_ssl: false

    # AAP Deployment Settings
    aap_namespace: "aap"
    aap_instance_name: "aap"
    aap_version: "2.6"
    aap_deploy_aap_channel: "stable-2.6"
    aap_org_name: "Default"

    # Configuration Collection
    aap_deploy_cac_collection: "infra.controller_configuration"

    # AAP 2.6 Platform Structure
    aap_ocp_install_platform:
      instance_name: "{{ aap_instance_name }}"

    # Controller Connection Settings
    controller_host: "{{ lookup('env', 'CONTROLLER_HOST') | default('aap-controller-aap.apps-crc.testing', true) }}"
    controller_hostname: "{{ controller_host }}"
    controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') | default('admin', true) }}"
    controller_password: "{{ lookup('env', 'CONTROLLER_PASS') }}"
    controller_validate_certs: false
    controller_configuration_secure_logging: false

    # Bootstrap Role Connection Settings
    bootstrap_controller_hostname: "{{ controller_host }}"
    bootstrap_controller_password: "{{ controller_password }}"
    bootstrap_controller_validate_certs: false
    aap_verify_ssl: false

    # License Manifest Path (Defaults to manifest.zip in repository root)
    bootstrap_aap_license_manifest: "{{ aap_license_manifest | default(playbook_dir ~ '/manifest.zip') }}"
    aap_license_manifest: "{{ playbook_dir }}/manifest.zip"

  pre_tasks:
    - name: Force SSL validation variables to native booleans
      ansible.builtin.set_fact:
        controller_validate_certs: false
        bootstrap_controller_validate_certs: false
        aap_verify_ssl: false

  roles:
    - role: infra.openshift_virtualization_migration.aap_deploy